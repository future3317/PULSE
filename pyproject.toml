[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crosspiezo"
version = "0.1.0"
description = "Strict cross-protocol piezoelectric tensor audit (CrossPiezo / PULSE Phase 0-4)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "pydantic>=2.0",
    "ase>=3.22",
    "pymatgen>=2023.0",
    "spglib>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.5",
]

[project.scripts]
crosspiezo = "crosspiezo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/crosspiezo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
per-file-ignores = {"scripts/*" = ["E402"], "tests/*" = ["E402"]} # scripts append src/ to sys.path before importing

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
