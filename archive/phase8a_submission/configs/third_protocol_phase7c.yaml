plan_name: third_protocol_adjudication_phase7c
status: pre_registered_not_executed
branch: paper/screening-resolution-q1-v1
baseline_commit: 7c19a3a2401bc37b9f3dcb680c66c052d54f4c71
candidate_selection:
  n_materials: 48
  strata:
  - name: consensus_elite
    n: 10
    criteria: intersection of JARVIS and MP top-10% by F1/F3/F4
  - name: jarvis_only_elite
    n: 10
    criteria: top-10% by JARVIS but outside MP top-10%
  - name: mp_only_elite
    n: 10
    criteria: top-10% by MP but outside JARVIS top-10%
  - name: consensus_low
    n: 8
    criteria: bottom-20% by both sources, non-zero response
  - name: diversity_balanced
    n: 10
    criteria: balance crystal system, atom count and P2 membership
  diversity_constraints:
    crystal_systems:
    - triclinic
    - monoclinic
    - orthorhombic
    - tetragonal
    - trigonal
    - hexagonal
    - cubic
    max_per_crystal_system: 10
    max_per_reduced_formula: 3
    require_p2_balance: true
frozen_endpoints:
- F1_Frobenius
- F3_Longitudinal
- F4_KelvinOp
frozen_portfolio_strategies:
- jarvis_only
- mp_only
- average_percentile
- borda_count
- maximin_percentile
- intersection_first
- balanced_union
- disagreement_abstention
- minimax_oracle
evaluation_metrics:
- Recall@k
- NDCG@k
- minimax_recall_regret
- worst_source_normalized_utility
budget:
  n_materials: 48
  estimated_core_hours_per_material: 24-96
  max_wall_time_weeks: 4
protocol:
  code: ABINIT or Quantum ESPRESSO
  functional: PBEsol or PBE
  pseudopotential: ONCV or PAW (must be documented)
  kpoint_density: '>= 1000 k-points per reciprocal atom'
  ecut: '>= 60 Ha (ABINIT) or equivalent plane-wave cutoff'
  tensor_convention: piezoelectric stress e in C/m^2, full Cartesian 3x3x3, engineering
    Voigt order xx,yy,zz,yz,xz,xy
  fail_policy: If a candidate fails to converge or relax, replace with the next-ranked
    candidate in the same stratum; document all failures and quarantined materials.
outputs:
- raw_total_piezo_tensor_per_protocol
- relaxed_structure_and_CIF
- convergence_log
- transformation_history_json
- source_field_provenance_record
