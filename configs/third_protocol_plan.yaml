plan_name: third_protocol_adjudication
status: pre_registered_not_executed
candidate_selection:
  strata:
  - name: core_high_disagreement
    n: 12
    criteria: top normalized discrepancy in Core
  - name: core_low_disagreement
    n: 12
    criteria: bottom normalized discrepancy in Core
  - name: high_response
    n: 12
    criteria: top Frobenius norm in either source
  - name: low_response
    n: 12
    criteria: bottom non-zero Frobenius norm
  diversity:
    crystal_systems:
    - triclinic
    - monoclinic
    - tetragonal
    - trigonal
    - hexagonal
    - cubic
    max_per_crystal_system: 8
    max_per_prototype: 3
protocol:
  code: ABINIT or Quantum ESPRESSO
  functional: PBEsol or PBE
  pseudopotential: ONCV or PAW (must be documented)
  kpoint_density: '>= 1000 k-points per reciprocal atom'
  ecut: '>= 60 Ha (ABINIT) or equivalent plane-wave cutoff'
  tensor_convention: piezoelectric stress e in C/m^2, full Cartesian 3x3x3, engineering
    Voigt order xx,yy,zz,yz,xz,xy
  fail_policy: If a candidate fails to converge or relax, replace with the next-ranked
    candidate in the same stratum; document all failures.
budget:
  n_materials: 48
  estimated_core_hours_per_material: 24-96
  max_wall_time_weeks: 4
outputs:
- raw_total_piezo_tensor_per_protocol
- relaxed_structure_and_CIF
- convergence_log
- transformation_history_json
